name: CI

on:
  push:
    branches:
      - production
      - main
      - development
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
